<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text fill=%22%2384cc16%22 y=%22.9em%22 font-size=%2290%22>Z</text></svg>">
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ahmed Zubayer</title>
    <!-- Your existing, compiled assets -->
    <script type="module" crossorigin src="./assets/main-Cgw02S6R.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-BP-OHASh.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- 
        ================================================================================
        CLIPBOARD INJECTION SCRIPT & UI (FINAL ATTEMPT: Z-INDEX and RAF FIX)
        1. Set ultra-high z-index for guaranteed foreground display.
        2. Use requestAnimationFrame to force the CSS visibility class to apply correctly.
        ================================================================================ 
    -->

    <!-- 1. Notification UI Styles and HTML -->
    <style>
        /* Custom CSS for the slide-in/slide-out animation */
        #copy-notification {
            /* Initial state: hidden and slightly off-screen */
            opacity: 0;
            visibility: hidden;
            transform: translateY(-20px);
            transition: all 0.4s ease-out; 
        }
        .notification-active {
            /* Active state: visible and in place */
            opacity: 1 !important;
            visibility: visible !important;
            transform: translateY(0) !important;
        }
    </style>

    <div 
        id="copy-notification"
        class="fixed top-5 right-5 z-[99999] rounded-lg shadow-xl" 
        aria-live="assertive"
    >
        <!-- Notification content uses your Tailwind styling -->
        <div class="flex items-center gap-3 p-3 bg-green-600 text-white rounded-lg">
            <!-- Success Icon (Clipboard Check SVG) -->
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                <path d="M15 2H9a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1z"></path>
                <polyline points="9 14 12 17 15 14"></polyline>
            </svg>
            <span id="notification-message" class="font-medium text-sm"></span>
        </div>
    </div>

    <!-- 2. Pure JavaScript Logic (using MutationObserver and Secure Extraction) -->
    <script>
        // --- CONFIGURATION ---
        const NOTIFICATION_DURATION = 3000; // 3 seconds
        let handlerAttached = false;
        let observerInstance = null; 

        // --- NOTIFICATION HANDLER (REFINED) ---
        function showNotification(message) {
            const container = document.getElementById('copy-notification');
            const messageSpan = document.getElementById('notification-message');

            if (!container || !messageSpan) return;

            messageSpan.textContent = message;

            // FIX: Use requestAnimationFrame to force the transition class to apply correctly,
            // bypassing potential timing issues in the compiled environment.
            requestAnimationFrame(() => {
                container.classList.add('notification-active');
            });


            setTimeout(() => {
                container.classList.remove('notification-active');
                // The element will then transition back to its default hidden state (opacity: 0, visibility: hidden)
            }, NOTIFICATION_DURATION);
        }

        // --- CORE COPY FUNCTION (Logic assumes success since the copy is known to work) ---
        function copyEmailToClipboard(event, emailAddress) {
            if (event) {
                event.preventDefault();
            }
            
            if (!emailAddress) {
                showNotification('Copy failed: Email not found.');
                return;
            }

            try {
                // 1. Create temporary element
                const tempElement = document.createElement('textarea');
                tempElement.value = emailAddress;
                tempElement.style.position = 'fixed'; 
                tempElement.style.top = '0';
                tempElement.style.left = '-9999px';
                document.body.appendChild(tempElement);
                
                // 2. Select and execute copy command
                tempElement.select();
                // We execute the command but ignore its return value, as it is unreliable here.
                document.execCommand('copy'); 
                
                // 3. Cleanup
                document.body.removeChild(tempElement);
                
                // 4. Guaranteed Notification: If no exception was thrown, the copy succeeded.
                showNotification(`Email Address Copied! 📧`);

            } catch (err) {
                console.error('Copy to clipboard failed:', err);
                showNotification('Copy failed. Please copy the email manually.');
            }
        }

        // --- ATTACH HANDLER LOGIC (Finds mailto link, extracts address, modifies DOM) ---
        function attachClipboardHandler() {
            if (handlerAttached) return null;

            // Find the mailto link 
            const emailLink = document.querySelector('a[href^="mailto:"]');

            if (emailLink) {
                const fullHref = emailLink.getAttribute('href');
                let emailAddress = null;

                if (fullHref) {
                    emailAddress = fullHref.replace(/^mailto:/i, '');
                }

                if (emailAddress && emailAddress.includes('@')) {
                    // Remove the href to stop mailto opening an email client
                    emailLink.removeAttribute('href');
                    emailLink.style.cursor = 'pointer'; 
                    
                    // Attach the handler using a closure
                    emailLink.addEventListener('click', (e) => copyEmailToClipboard(e, emailAddress));
                    handlerAttached = true;
                    
                    if (observerInstance) {
                        observerInstance.disconnect();
                    }
                    
                    return emailLink;
                }
            }
            return null;
        }

        // --- INITIALIZATION ---
        window.addEventListener('load', () => {
            // 1. Check immediately upon load
            if (attachClipboardHandler()) {
                return; 
            }

            // 2. If not found, start observing the root element for changes
            const root = document.getElementById('root');
            if (!root) {
                console.error('Copy-to-Clipboard: Root element #root not found.');
                return;
            }

            // Callback function to execute when mutations are observed
            const observerCallback = (mutationsList, observer) => {
                attachClipboardHandler();
            };

            // Create and store observer instance
            observerInstance = new MutationObserver(observerCallback);

            // Start observing the target node for configured mutations
            const config = { childList: true, subtree: true };
            observerInstance.observe(root, config);
        });
    </script>
  </body>
</html>
