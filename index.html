<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 
        UPDATED: Added font-weight="900" to make the 'Z' bold in the favicon.
        The favicon now uses a bold green 'Z'.
    -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text font-weight=%22900%22 fill=%22%2384cc16%22 y=%22.9em%22 font-size=%2290%22>Z</text></svg>">
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ahmed Zubayer</title>
    <!-- Your existing, compiled assets -->
    <script type="module" crossorigin src="./assets/main-Cgw02S6R.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-BP-OHASh.css">
  </head>
  <body>
    <!-- The React application lives here -->
    <div id="root"></div>

    <!-- 
        ================================================================================
        CLIPBOARD NOTIFICATION UI (V7: CUSTOM SVG ICON ADDED)
        - Icon: Custom Green Circle with Tick SVG added.
        - Text Size: text-lg.
        - Duration: 5000ms.
        ================================================================================ 
    -->

    <div 
        id="copy-notification"
        aria-live="assertive"
        style="
            /* CRITICAL CSS: PURE STANDARD STYLES FOR ISOLATION */
            position: fixed; 
            bottom: 20px; 
            left: 20px;   
            z-index: 99999; 
            border-radius: 0.5rem; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);

            /* TRANSITION AND INITIAL STATE */
            opacity: 0; 
            visibility: hidden; 
            transform: translateY(20px); 
            transition: all 0.4s ease-out;
        "
    >
        <!-- Inner content now uses py-4 px-6, text-lg, and flex layout for the icon and text -->
        <div class="flex items-center gap-3 py-4 px-6 bg-white text-black rounded-lg border border-gray-300">
            <!-- New custom SVG icon (Green circle with white tick) -->
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="w-6 h-6">
                <!-- Green Circle (#10B981 is Tailwind's default green-500) -->
                <circle cx="12" cy="12" r="10" fill="#10B981" stroke="none"/>
                <!-- White Tick -->
                <path d="M9 12l2 2l4-4" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
            </svg>

            <!-- Text size is text-lg -->
            <span id="notification-message" class="font-medium text-lg"></span>
        </div>
    </div>

    <!-- 2. Pure JavaScript Logic -->
    <script>
        // --- CONFIGURATION ---
        const NOTIFICATION_DURATION = 5000; // Display time: 5000ms
        let handlerAttached = false;
        let observerInstance = null; 
        const TRANSITION_DURATION_MS = 400; 
        const FALLBACK_EMAIL = "thisiszubayer@gmail.com"; 

        // --- NOTIFICATION HANDLER ---
        function showNotification(message) {
            const container = document.getElementById('copy-notification');
            const messageSpan = document.getElementById('notification-message');

            if (!container || !messageSpan) return;

            messageSpan.textContent = message;

            // 1. Force visible state: Slides UP to Y(0)
            requestAnimationFrame(() => {
                container.style.opacity = '1';
                container.style.visibility = 'visible';
                container.style.transform = 'translateY(0)';
            });

            // 2. Set timeout to hide it
            setTimeout(() => {
                // Hides: Slides DOWN to Y(20px)
                container.style.opacity = '0';
                container.style.transform = 'translateY(20px)'; 
                
                // 3. Delay the visibility change until the opacity transition is finished 
                setTimeout(() => {
                     container.style.visibility = 'hidden';
                }, TRANSITION_DURATION_MS); 

            }, NOTIFICATION_DURATION);
        }

        // --- CORE COPY FUNCTION ---
        function copyEmailToClipboard(event, emailAddress) {
            if (event) {
                event.preventDefault();
            }
            
            if (!emailAddress) {
                showNotification(`Copy failed. Email: ${FALLBACK_EMAIL}`);
                return;
            }

            try {
                // Clipboard access via execCommand (works in this environment)
                const tempElement = document.createElement('textarea');
                tempElement.value = emailAddress;
                tempElement.style.position = 'fixed'; 
                tempElement.style.top = '0';
                tempElement.style.left = '-9999px';
                document.body.appendChild(tempElement);
                tempElement.select();
                document.execCommand('copy'); 
                document.body.removeChild(tempElement);
                
                // Success message
                // UPDATED: Removed the ✔️ emoji as the SVG icon now handles the success visual
                showNotification(`Email address copied successfully!`);

            } catch (err) {
                // Error message
                console.error('Copy to clipboard failed:', err);
                showNotification(`Copy failed. Email: ${FALLBACK_EMAIL}`);
            }
        }

        // --- ATTACH HANDLER LOGIC ---
        function attachClipboardHandler() {
            if (handlerAttached) return null;

            const emailLink = document.querySelector('a[href^="mailto:"]');

            if (emailLink) {
                const fullHref = emailLink.getAttribute('href');
                let emailAddress = null;

                if (fullHref) {
                    emailAddress = fullHref.replace(/^mailto:/i, '');
                }

                if (emailAddress && emailAddress.includes('@')) {
                    emailLink.removeAttribute('href');
                    emailLink.style.cursor = 'pointer'; 
                    
                    emailLink.addEventListener('click', (e) => copyEmailToClipboard(e, emailAddress));
                    handlerAttached = true;
                    
                    if (observerInstance) {
                        observerInstance.disconnect(); 
                    }
                    
                    return emailLink;
                }
            }
            return null;
        }

        // --- INITIALIZATION ---
        window.addEventListener('load', () => {
            if (attachClipboardHandler()) {
                return; 
            }

            const root = document.getElementById('root');
            if (!root) {
                return;
            }

            const observerCallback = (mutationsList, observer) => {
                attachClipboardHandler();
            };

            observerInstance = new MutationObserver(observerCallback);
            const config = { childList: true, subtree: true };
            observerInstance.observe(root, config);
        });
    </script>
  </body>
</html>
