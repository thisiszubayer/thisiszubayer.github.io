<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text fill=%22%2384cc16%22 y=%22.9em%22 font-size=%2290%22>Z</text></svg>">
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ahmed Zubayer</title>
    <script type="module" crossorigin src="./assets/main-Cgw02S6R.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-BP-OHASh.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- 
        ================================================================================
        CLIPBOARD INJECTION SCRIPT & UI (MUST BE PLACED JUST BEFORE THE CLOSING </body> TAG)
        This block adds the Copy-to-Clipboard functionality for the email address 'thisiszubayer@gmail.com'.
        It includes its own styles and logic to ensure it runs correctly over the React component.
        ================================================================================ 
    -->

    <!-- 1. Notification UI Styles and HTML -->
    <style>
        /* Custom CSS for the slide-in/slide-out animation */
        #copy-notification {
            /* Initial state: hidden and slightly off-screen */
            opacity: 0;
            visibility: hidden;
            transform: translateY(-20px);
            transition: all 0.4s ease-out; 
        }
        .notification-active {
            /* Active state: visible and in place */
            opacity: 1 !important;
            visibility: visible !important;
            transform: translateY(0) !important;
        }
    </style>

    <div 
        id="copy-notification"
        class="fixed top-5 right-5 z-[1000] rounded-lg shadow-xl"
        aria-live="assertive"
    >
        <!-- Notification content uses your Tailwind styling -->
        <div class="flex items-center gap-3 p-3 bg-green-600 text-white rounded-lg">
            <!-- Success Icon (Clipboard Check SVG) -->
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                <path d="M15 2H9a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1z"></path>
                <polyline points="9 14 12 17 15 14"></polyline>
            </svg>
            <span id="notification-message" class="font-medium text-sm"></span>
        </div>
    </div>

    <!-- 2. Pure JavaScript Logic -->
    <script>
        // --- CONFIGURATION ---
        const EMAIL_ADDRESS = 'thisiszubayer@gmail.com';
        const NOTIFICATION_DURATION = 3000; // 3 seconds

        // --- NOTIFICATION HANDLER ---
        function showNotification(message) {
            const container = document.getElementById('copy-notification');
            const messageSpan = document.getElementById('notification-message');

            if (!container || !messageSpan) {
                console.error("Copy-to-Clipboard: Notification UI elements not found.");
                return;
            }

            messageSpan.textContent = message;
            
            // 1. Show notification
            container.classList.add('notification-active');

            // 2. Hide after duration
            setTimeout(() => {
                container.classList.remove('notification-active');
            }, NOTIFICATION_DURATION);
        }

        // --- CORE COPY FUNCTION ---
        function copyEmailToClipboard(event) {
            // Prevent the default action (opening the mailto link)
            if (event) {
                event.preventDefault();
            }
            
            let success = false;
            try {
                // Create a temporary, hidden textarea element
                const tempElement = document.createElement('textarea');
                tempElement.value = EMAIL_ADDRESS;
                
                // Set styles to make it invisible and off-screen
                tempElement.style.position = 'fixed'; 
                tempElement.style.top = '0';
                tempElement.style.left = '-9999px';
                document.body.appendChild(tempElement);
                
                // Select and copy the text
                tempElement.select();
                
                // Use execCommand('copy') for reliable cross-browser/iFrame copying
                document.execCommand('copy'); 
                
                document.body.removeChild(tempElement);
                success = true;
            } catch (err) {
                console.error('Copy to clipboard failed:', err);
            }

            if (success) {
                showNotification(`${EMAIL_ADDRESS} copied! 📋`);
            } else {
                // Fallback
                showNotification('Copy failed. Please copy the email manually.');
            }
        }

        // --- INITIALIZATION ---
        // Wait for the window load event to ensure all React elements are in the DOM
        window.addEventListener('load', () => {
            let emailLink = null;

            // Attempt 1: Target the <a> element using its specific href attribute (standard method)
            emailLink = document.querySelector(`a[href="mailto:${EMAIL_ADDRESS}"]`);

            if (!emailLink) {
                // Attempt 2: Search all links for the email address in their content (more robust)
                const allLinks = document.querySelectorAll('a');
                for (const link of allLinks) {
                    if (link.textContent.includes(EMAIL_ADDRESS)) {
                        emailLink = link;
                        console.log('Copy-to-Clipboard: Found link by content search.');
                        break;
                    }
                }
            }

            if (emailLink) {
                // Overwrite the default click behavior with our copy function
                emailLink.addEventListener('click', copyEmailToClipboard);
                console.log(`Copy-to-Clipboard: Function attached to email link (${EMAIL_ADDRESS}).`);
            } else {
                console.warn('Copy-to-Clipboard: Could not find the target email link element.');
            }
        });
    </script>
  </body>
</html>
